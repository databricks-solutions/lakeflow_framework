<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lakeflow Framework — How It Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1B3139;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;margin:0;overflow:hidden}
  /* fit the fixed 1120px-wide stage to the (iframe) viewport width. Pinned top-left and out
     of flow so the scaled visual always spans exactly W x (660*s) — which equals the iframe's
     aspect-ratio height — with no flexbox centering offset. */
  #fit{position:absolute;top:0;left:0;transform-origin:top left}
  .sico{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
  .sico svg{width:14px;height:14px}

  .desktop{width:1120px;height:624px;position:relative;overflow:hidden;background:linear-gradient(145deg,#0B2026 0%,#112830 100%);border-radius:14px 14px 0 0;box-shadow:0 30px 100px rgba(0,0,0,.7)}

  /* windows */
  .win{position:absolute;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.12);opacity:0;transform:translateY(14px) scale(.97);transition:opacity .18s ease,transform .22s cubic-bezier(.22,1,.36,1);overflow:hidden}
  .win.show{opacity:1;transform:translateY(0) scale(1)}
  .win.out{opacity:0;transform:translateY(-8px) scale(1.01)}
  .win.expand{transition:opacity .18s ease,transform .22s cubic-bezier(.22,1,.36,1),width .85s cubic-bezier(.22,1,.36,1),height .85s cubic-bezier(.22,1,.36,1),left .85s cubic-bezier(.22,1,.36,1),right .85s cubic-bezier(.22,1,.36,1),top .85s cubic-bezier(.22,1,.36,1)}

  .wbar{height:32px;display:flex;align-items:center;padding:0 12px;gap:7px}
  .wd{width:10px;height:10px;border-radius:50%}
  .wd.r{background:#FF5F57}.wd.y{background:#FEBC2E}.wd.g{background:#28C840}
  .wbar .wt{flex:1;text-align:center;font-size:11px}

  /* terminal */
  .term{background:#0D0D0D}
  .term .wbar{background:#1A1A1A;border-bottom:1px solid #2A2A2A}
  .term .wbar .wt{font-family:'DM Mono',monospace;color:#777}
  .term-b{padding:10px 14px;font-family:'DM Mono',monospace;font-size:11.5px;line-height:1.7;color:#C0C0C0;overflow:hidden}
  .term-b .pr{color:#28C840}.term-b .cm{color:#E0E0E0}
  .term-b .ok{color:#28C840}.term-b .wa{color:#FDD835}.term-b .re{color:#FF3621}.term-b .pt{color:#AB47BC}
  .tl{opacity:0;transform:translateY(2px);transition:opacity .2s,transform .2s;min-height:19px}
  .tl.show{opacity:1;transform:translateY(0)}
  .tc{display:inline-block;width:6px;height:13px;background:#C0C0C0;vertical-align:text-bottom;animation:bk .8s step-end infinite}
  @keyframes bk{0%,100%{opacity:1}50%{opacity:0}}

  /* ide */
  .ide{background:#1E1E1E}
  .ide .wbar{background:#323233;border-bottom:1px solid #252525}
  .ide .wbar .wt{color:#999}
  .ide-lay{display:flex;height:calc(100% - 32px)}
  .ide-s{width:190px;background:#181818;border-right:1px solid #2A2A2A;padding:5px 0;font-family:'DM Mono',monospace;font-size:10px}
  .ide-sh{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#666;padding:4px 10px;font-family:'Inter',sans-serif;font-weight:600}
  .sf{padding:2px 10px;color:#888;display:flex;align-items:center;gap:4px}
  .sf.dir{color:#666}.sf.i1{padding-left:20px}.sf.i2{padding-left:32px}.sf.i3{padding-left:44px}
  .sf.on{background:#2A2D2E;color:#ddd}
  .sf .ic{font-size:9px;flex-shrink:0}
  .ide-m{flex:1;display:flex;flex-direction:column;position:relative}
  .ide-tabs{height:30px;background:#181818;display:flex;border-bottom:1px solid #2A2A2A}
  .ide-tab{padding:0 11px;display:flex;align-items:center;gap:4px;font-size:10px;color:#888;border-right:1px solid #2A2A2A;font-family:'DM Mono',monospace;position:relative}
  .ide-tab.on{background:#1E1E1E;color:#ddd}
  .ide-tab.on::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:#FF3621}
  .ide-tab .td{width:5px;height:5px;border-radius:50%;flex-shrink:0}
  .ide-ed{flex:1;padding:5px 0;font-family:'DM Mono',monospace;font-size:10px;line-height:1.32;overflow:hidden}
  .el{display:flex;opacity:0;transition:opacity .1s,background .3s}
  .el.show{opacity:1}
  .el .ln{width:34px;text-align:right;color:#444;padding-right:10px;flex-shrink:0;user-select:none;font-size:10px}
  .el .code{white-space:pre}
  .el .k{color:#9CDCFE}.el .s{color:#CE9178}.el .p{color:#666}.el .c{color:#6A9955}
  .el .vr{color:#C586C0}.el .bl{color:#569CD6}.el .nm{color:#B5CEA8}
  .el.hlp{background:rgba(139,92,246,.07);border-left:2px solid #8B5CF6}
  .el.hlg{background:rgba(0,169,114,.06);border-left:2px solid #00A972}
  /* section highlights for the nodespec spec — light block background + colored left bar */
  .el.hl-yel{background:rgba(234,179,8,.05);box-shadow:inset 3px 0 #EAB308}
  .el.hl-blu{background:rgba(21,112,239,.045);box-shadow:inset 3px 0 #1570EF}
  .el.hl-pur{background:rgba(139,92,246,.05);box-shadow:inset 3px 0 #8B5CF6}
  .el.hl-grn{background:rgba(0,169,114,.045);box-shadow:inset 3px 0 #00A972}

  /* annotation tooltip pinned to right of editor, vertically aligned to a line */
  .ann{position:absolute;right:14px;font-size:9.5px;font-weight:500;padding:4px 10px;border-radius:5px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ann.show{opacity:1}
  .ann b{font-weight:700}
  .ann.pur{background:rgba(139,92,246,.12);color:#B8A2F0;border:1px solid rgba(139,92,246,.2)}
  .ann.grn{background:rgba(0,169,114,.1);color:#5ECFA0;border:1px solid rgba(0,169,114,.15)}
  .ann.yel{background:rgba(234,179,8,.14);color:#E6C34A;border:1px solid rgba(234,179,8,.24)}
  .ann.blu{background:rgba(21,112,239,.13);color:#7FB0F5;border:1px solid rgba(21,112,239,.22)}

  /* databricks light */
  .dbx{background:#fff}
  .dbx .wbar{background:#fff;border-bottom:1px solid #E8E8E8}
  .dbx-url{flex:1;margin:0 10px;background:#F5F5F5;border-radius:6px;padding:3px 10px;font-size:10px;color:#888;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;border:1px solid #E8E8E8}
  .dbx-url .lock{color:#28C840;font-size:9px}
  .dbx-body{display:flex;height:calc(100% - 32px)}
  .dbx-side{width:170px;background:#FAFAFA;border-right:1px solid #E8E8E8;padding:10px 0;display:flex;flex-direction:column}
  .dbx-logo{padding:2px 14px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #E8E8E8;margin-bottom:6px}
  .dbx-logo .lt{font-size:13px;font-weight:700;color:#1B3139;letter-spacing:-.02em}
  .ni{display:flex;align-items:center;gap:7px;padding:5px 14px;font-size:11.5px;color:#666;cursor:default;transition:background .15s}
  .ni.on{background:#EDF2F8;color:#1B3139;font-weight:500}
  .dbx-main{flex:1;display:flex;flex-direction:column;background:#fff}
  .dbx-top{height:38px;background:#fff;border-bottom:1px solid #E8E8E8;display:flex;align-items:center;padding:0 18px;gap:4px;font-size:11.5px}
  .dbx-top .bc{color:#999}.dbx-top .cur{color:#1B3139;font-weight:600}
  .dbx-cnt{flex:1;padding:14px 18px;overflow:hidden}

  .ws-path{font-family:'DM Mono',monospace;font-size:9.5px;color:#999;padding:5px 10px;background:#F8F8F8;border-radius:5px;border:1px solid #E8E8E8;margin-bottom:10px;opacity:0;transition:opacity .3s}
  .ws-path.show{opacity:1}
  .ws-path .hp{color:#7C3AED;font-weight:500}
  .ws-path .hg{color:#059669;font-weight:500}
  .ws-fi{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:5px;font-size:11.5px;color:#555;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s}
  .ws-fi.show{opacity:1;transform:translateX(0)}
  .ws-fi .fn{font-family:'DM Mono',monospace;font-size:10px;color:#333}
  .ws-fi.dir .fn{font-weight:600;color:#1B3139}
  .ws-fi .fsz{margin-left:auto;font-size:8.5px;color:#BBB;font-family:'DM Mono',monospace}

  /* pipeline — real Databricks SDP style */
  .pipe-topbar{display:flex;align-items:center;padding:10px 18px;border-bottom:1px solid #E8E8E8;opacity:0;transition:opacity .3s}
  .pipe-topbar.show{opacity:1}
  .pipe-topbar .pipe-icon{color:#1B3139;font-size:14px;margin-right:6px}
  .pipe-topbar .pipe-name{font-size:13px;font-weight:600;color:#1570EF;text-decoration:underline;text-decoration-color:transparent}
  .pipe-topbar .pipe-ext{font-size:11px;color:#999;margin-left:2px}
  .pipe-topbar .pipe-open{margin-left:auto;font-size:11px;padding:5px 14px;border:1px solid #D1D5DB;border-radius:4px;color:#1B3139;font-weight:500;cursor:default;background:#fff;display:flex;align-items:center;gap:4px}

  .pipe-status-bar{display:flex;align-items:center;gap:8px;padding:6px 18px;opacity:0;transition:opacity .3s}
  .pipe-status-bar.show{opacity:1}
  .pbadge{font-size:9px;padding:2px 10px;border-radius:10px;font-weight:600;letter-spacing:.02em}
  .pbadge.st{background:#FEF9C3;color:#A16207;border:1px solid #FDE68A}
  .pbadge.run{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}

  .dag-area{flex:1;position:relative;opacity:0;transition:opacity .3s;overflow:hidden;
    background:radial-gradient(circle,#D4D7DB 0.7px,transparent 0.7px);background-size:9px 9px;background-color:#FAFAFA}
  .dag-area.show{opacity:1}

  .dag-flow{display:flex;align-items:center;height:100%;padding:0 24px}

  /* zoom controls */
  .dag-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .3s}
  .dag-zoom.show{opacity:1}
  .dag-zoom-btn{width:26px;height:26px;border:1px solid #E5E7EB;border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:#666;cursor:default}

  /* SDP node wrapper */
  .nd-wrap{display:flex;flex-direction:column;align-items:stretch;flex-shrink:0;opacity:0;transform:scale(.88);transition:opacity .35s,transform .35s cubic-bezier(.22,1,.36,1)}
  .nd-wrap.show{opacity:1;transform:scale(1)}

  /* type label row above card */
  .nd-type-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;padding:0 2px}
  .nd-type{font-size:9px;color:#888;font-family:'Inter',sans-serif}
  .nd-dur{font-size:9px;color:#888;font-family:'DM Mono',monospace;opacity:0;transition:opacity .3s}
  .nd-dur.show{opacity:1}

  /* green top bar — gray by default, green when done */
  .nd-topbar{height:3px;border-radius:3px 3px 0 0;background:#E5E7EB;transition:background .3s}
  .nd-topbar.done{background:#16A34A}

  /* card body */
  .nd{border-radius:0 0 6px 6px;padding:10px 14px;background:#fff;border:1px solid #E5E7EB;border-top:none;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:140px}

  .nd-title{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .nd-tbl-icon{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
  .nd-tbl-icon svg{width:16px;height:16px}
  .nd .nlbl{font-size:11px;font-weight:600;color:#1B3139;white-space:nowrap}
  /* outlined green checkmark circle */
  .nd-check{width:18px;height:18px;border-radius:50%;border:1.5px solid #D1D5DB;display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0;transition:border-color .3s}
  .nd-check.show{border-color:#16A34A}
  .nd-check svg{width:11px;height:11px;opacity:0;transition:opacity .3s}
  .nd-check.show svg{opacity:1}

  .nd-stats{font-size:9.5px;color:#555;font-family:'Inter',sans-serif}
  .nd-stats span{opacity:0;transition:opacity .3s}
  .nd-stats span.show{opacity:1}

  /* connector arrows — dotted style like real SDP */
  .dag-arrow{flex:1;height:9px;position:relative;opacity:0;transition:opacity .4s;min-width:20px;margin:0;align-self:center}
  .dag-arrow.show{opacity:1}
  /* dashed line stops short of the arrowhead so it doesn't poke through the tip */
  .dag-arrow::before{content:'';position:absolute;left:0;right:7px;top:50%;border-top:1.5px dashed #C0C0C0}
  .dag-arrow::after{content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:0;height:0;border:4.5px solid transparent;border-left:7px solid #C0C0C0}

  /* badge */
  .badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#FF3621;color:#fff;font-size:12px;font-weight:600;padding:5px 20px;border-radius:16px;z-index:200;opacity:0;transition:opacity .15s;white-space:nowrap;pointer-events:none;letter-spacing:.01em;box-shadow:0 4px 20px rgba(255,54,33,.3)}
  .badge.show{opacity:1}

  /* cursor */
  .cursor{position:absolute;width:14px;height:18px;z-index:300;pointer-events:none;opacity:0;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),opacity .15s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
  .cursor.show{opacity:1}.cursor.fast{transition-duration:.25s}
  .ring{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,54,33,.5);z-index:299;pointer-events:none;opacity:0;transform:scale(0)}
  .ring.pop{animation:rpop .35s ease forwards}
  @keyframes rpop{0%{transform:scale(0);opacity:1}100%{transform:scale(2.5);opacity:0}}

  /* control bar */
  .cbar{width:1120px;height:36px;background:rgba(11,32,38,.97);border-radius:0 0 14px 14px;display:flex;align-items:center;padding:0 14px;gap:8px;border-top:1px solid rgba(255,255,255,.05)}
  .cbtn{background:none;border:none;color:#8A9BAA;padding:0;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:4px;transition:all .12s;flex-shrink:0}
  .cbtn:hover{color:#fff;background:rgba(255,255,255,.06)}
  .cbtn.hidden{display:none}
  .pbar-wrap{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;cursor:pointer;position:relative;transition:height .1s}
  .pbar-wrap:hover{height:6px}
  .pbar-fill{height:100%;background:#FF3621;border-radius:2px;width:0%;pointer-events:none;transition:none}
  .pbar-wrap:hover .pbar-fill{background:#ff5040}
  .pbar-thumb{position:absolute;width:12px;height:12px;border-radius:50%;background:#FF3621;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .1s;pointer-events:none;box-shadow:0 0 4px rgba(255,54,33,.4)}
  .pbar-wrap:hover .pbar-thumb{opacity:1}
  .tdisp{font-family:'DM Mono',monospace;font-size:10px;color:#666;min-width:75px;text-align:right;user-select:none;flex-shrink:0}
</style>
</head>
<body>

<div class="fit" id="fit">
<div class="desktop" id="desktop">
  <svg class="cursor" id="cur" viewBox="0 0 14 18"><path d="M1 1L1 14L3.8 11L7 17L9 16L5.8 10L10 9.5L1 1Z" fill="white" stroke="black" stroke-width=".7"/></svg>
  <div class="ring" id="ring"></div>
  <div class="badge" id="badge"></div>

  <div class="win term" id="winTerm" style="width:530px;height:220px;left:20px;top:90px">
    <div class="wbar"><div class="wd r"></div><div class="wd y"></div><div class="wd g"></div><span class="wt" id="termT">Terminal</span></div>
    <div class="term-b" id="termB"></div>
  </div>

  <div class="win ide" id="winIDE" style="width:940px;height:560px;left:90px;top:40px">
    <div class="wbar"><div class="wd r"></div><div class="wd y"></div><div class="wd g"></div><span class="wt" id="ideT">Visual Studio Code</span></div>
    <div class="ide-lay">
      <div class="ide-s" id="ideS"></div>
      <div class="ide-m"><div class="ide-tabs" id="ideTabs"></div><div class="ide-ed" id="ideEd"></div></div>
    </div>
  </div>

  <div class="win dbx" id="winDBX" style="width:540px;height:480px;right:20px;top:75px">
    <div class="wbar">
      <div class="wd r"></div><div class="wd y"></div><div class="wd g"></div>
      <div class="dbx-url"><span class="lock">🔒</span> <span id="dbxUrl">workspace.databricks.com</span></div>
    </div>
    <div class="dbx-body">
      <div class="dbx-side" id="dbxSide"></div>
      <div class="dbx-main"><div class="dbx-top" id="dbxTop"></div><div class="dbx-cnt" id="dbxCnt"></div></div>
    </div>
  </div>
</div>

<div class="cbar" id="cbar">
  <button class="cbtn" id="playBtn" onclick="togglePlay()" title="Pause">⏸</button>
  <div class="pbar-wrap" id="pbarWrap">
    <div class="pbar-fill" id="pbarFill"></div>
    <div class="pbar-thumb" id="pbarThumb"></div>
  </div>
  <span class="tdisp" id="tdisp">0:00 / 0:48</span>
  <button class="cbtn" id="skipBtn" onclick="skip()" title="Skip to end">⏭</button>
  <button class="cbtn hidden" id="replayBtn" onclick="redo()" title="Replay">↻</button>
</div>
</div>

<script>
const DUR=56500,FW_PATH='/Workspace/.bundle/framework/dev/src';
const $=id=>document.getElementById(id);
/* fit the fixed 1120x660 stage to the (iframe) viewport width; scale-aware coords below use __scale */
let __scale=1;
function fitDemo(){
  const s=(window.innerWidth||1120)/1120;
  __scale=s;
  const f=$('fit');if(!f)return;
  f.style.transform='scale('+s+')';
}
window.addEventListener('resize',fitDemo);
const bg=t=>{$('badge').textContent=t;$('badge').classList.add('show')};
const hb=()=>$('badge').classList.remove('show');
const showW=(id,s)=>{const w=$(id);if(s)Object.assign(w.style,s);w.classList.add('show');w.classList.remove('out')};
const hideW=id=>{$(id).classList.remove('show');$(id).classList.add('out')};
const mt=(x,y,f)=>{const c=$('cur');c.classList.toggle('fast',!!f);c.style.left=x+'px';c.style.top=y+'px'};
const sc=()=>$('cur').classList.add('show');
const hc=()=>$('cur').classList.remove('show');
const ck=(x,y)=>{const r=$('ring');r.classList.remove('pop');r.style.left=(x-7)+'px';r.style.top=(y-7)+'px';void r.offsetWidth;r.classList.add('pop')};
// Element-anchored cursor: compute target center relative to #desktop so clicks always land on the real element.
const elCenter=(elOrId,dx=0,dy=0)=>{const e=typeof elOrId==='string'?$(elOrId):elOrId;if(!e)return null;const r=e.getBoundingClientRect(),d=$('desktop').getBoundingClientRect(),k=__scale||1;return{x:(r.left-d.left+r.width/2)/k+dx,y:(r.top-d.top+r.height/2)/k+dy}};
const mte=(elOrId,f,dx,dy)=>{const p=elCenter(elOrId,dx,dy);if(p)mt(p.x,p.y,f)};
const cke=(elOrId,dx,dy)=>{const p=elCenter(elOrId,dx,dy);if(p)ck(p.x,p.y)};

/* === SEEKABLE TIMELINE ENGINE === */
let timeline=[],activeIds=[],elapsed=0,playStart=0,playing=false,done=false;

function ev(ms,fn){timeline.push({t:ms,fn})}

function scheduleFromNow(){
  activeIds.forEach(clearTimeout);activeIds=[];
  playStart=Date.now();
  timeline.forEach(e=>{
    const rem=e.t-elapsed;
    if(rem>0) activeIds.push(setTimeout(e.fn,rem));
  });
  rafLoop();
}

function rafLoop(){
  if(!playing||done)return;
  const now=Date.now();
  elapsed+=(now-playStart);playStart=now;
  if(elapsed>=DUR){elapsed=DUR;done=true;playing=false;
    $('playBtn').innerHTML='↻';$('playBtn').title='Replay';
    $('replayBtn').classList.remove('hidden');$('skipBtn').classList.add('hidden');
  }
  updateBar();
  if(!done)requestAnimationFrame(rafLoop);
}

function updateBar(){
  const pct=(elapsed/DUR)*100;
  $('pbarFill').style.width=pct+'%';
  $('pbarThumb').style.left=pct+'%';
  const es=Math.floor(elapsed/1000),ts=Math.floor(DUR/1000);
  $('tdisp').textContent=Math.floor(es/60)+':'+(es%60<10?'0':'')+(es%60)+' / '+Math.floor(ts/60)+':'+(ts%60<10?'0':'')+(ts%60);
}

function togglePlay(){
  if(done){redo();return}
  if(playing){
    // PAUSE
    playing=false;
    elapsed+=(Date.now()-playStart);
    activeIds.forEach(clearTimeout);activeIds=[];
    $('playBtn').innerHTML='▶';$('playBtn').title='Play';
  } else {
    // PLAY
    playing=true;
    $('playBtn').innerHTML='⏸';$('playBtn').title='Pause';
    scheduleFromNow();
  }
}

// Seek on progress bar click/drag
$('pbarWrap').addEventListener('mousedown',startSeek);
function startSeek(e){
  doSeek(e);
  const onMove=ev=>doSeek(ev);
  const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)};
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}
function doSeek(e){
  const rect=$('pbarWrap').getBoundingClientRect();
  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  seekTo(pct*DUR);
}
function seekTo(ms){
  activeIds.forEach(clearTimeout);activeIds=[];
  done=false;
  // Reset visual state
  resetVisuals();
  elapsed=0;
  // Instantly fire all events up to target time
  const target=Math.min(ms,DUR);
  // Disable transitions for instant replay
  document.querySelectorAll('.win,.nd,.tl,.ws-fi,.ws-path,.dag-arrow,.pipe-topbar,.pipe-status-bar,.dag-area,.nd-wrap,.nd-check,.nd-topbar,.nd-dur,.nd-stats span,.dag-zoom,.badge,.el').forEach(el=>el.style.transition='none');
  timeline.filter(e=>e.t<=target).forEach(e=>e.fn());
  // Re-enable transitions after a frame
  requestAnimationFrame(()=>{
    document.querySelectorAll('.win,.nd,.tl,.ws-fi,.ws-path,.dag-arrow,.pipe-topbar,.pipe-status-bar,.dag-area,.nd-wrap,.nd-check,.nd-topbar,.nd-dur,.nd-stats span,.dag-zoom,.badge,.el').forEach(el=>el.style.transition='');
  });
  elapsed=target;
  updateBar();
  if(playing){scheduleFromNow()}
  else{playStart=Date.now()}
}

function typeCmd(el,txt,sp,cb){
  let i=0;
  (function g(){if(!el)return;if(i<=txt.length){el.textContent=txt.slice(0,i);i++;activeIds.push(setTimeout(g,sp))}else if(cb)cb()})();
}

function revealLines(pfx,from,to,startMs,stepMs,hlClass){
  for(let i=from;i<=to;i++){
    ev(startMs+(i-from)*stepMs,()=>{const e=$(pfx+i);if(e)e.classList.add('show',hlClass)});
  }
}
/* pin an annotation centered vertically on a [from,to] section of editor lines */
function annotateSection(pfx,from,to,annClass,annId,html){
  const first=$(pfx+from),last=$(pfx+to);if(!first)return;
  const a=document.createElement('div');a.className='ann '+annClass;a.id=annId;a.innerHTML=html;
  const parent=$('winIDE').querySelector('.ide-m');
  const fr=first.getBoundingClientRect(),lrr=(last||first).getBoundingClientRect(),pr=parent.getBoundingClientRect(),k=__scale||1;
  const mid=((fr.top + lrr.bottom)/2 - pr.top)/k;  // vertical center of the whole section (unscaled)
  a.style.top=(mid - 11)+'px';
  parent.appendChild(a);
  setTimeout(()=>a.classList.add('show'),50);
}

function buildTimeline(){
  timeline=[];

  /* ===== SCENE 1: Clone & Deploy the Framework (0-13.5s) ===== */

  // 1b. Terminal LEFT — clone the repo
  ev(1400,()=>{

  // 1d. PAUSE on the cloned repo, THEN switch the browser to the workspace (still empty — nothing deployed yet)
  ev(8000,()=>{
    $('dbxSide').style.display='';

      <div class="ws-fi" id="wf2">${ico('python')}<span class="fn">spec_reader.py</span><span class="fsz">3.1 KB</span></div>
      <div class="ws-fi" id="wf3">${ico('python')}<span class="fn">config_resolver.py</span><span class="fsz">2.8 KB</span></div>
      <div class="ws-fi" id="wf4">${ico('python')}<span class="fn">validators.py</span><span class="fsz">1.9 KB</span></div>
      <div class="ws-fi" id="wf5">${ico('folder')}<span class="fn">config/</span></div>`;
  });
  ev(8300,()=>{const p=$('wsPath1');if(p)p.classList.add('show')});

  // 1e. NOW type the deploy command; files populate on the right as the deploy completes
  ev(8800,()=>{sl(4,'<span class="pr">~/lakeflow_framework $</span> <span class="cm" id="cmd1c"></span><span class="tc" id="tc1c"></span>')});
  ev(9100,()=>typeCmd($('cmd1c'),'databricks bundle deploy -t dev',40,()=>{const tc=$('tc1c');if(tc)tc.style.display='none'}));
  ev(10500,()=>sl(5,'<span class="wa">Uploading framework bundle...</span>'));
  ev(10700,()=>{sl(6,'<span class="ok">✓</span> 5 files uploaded');const d=$('wfd1');if(d)d.classList.add('show')});
  ev(10900,()=>{const f=$('wf1');if(f)f.classList.add('show')});
  ev(11200,()=>{const f=$('wf2');if(f)f.classList.add('show')});
  ev(11500,()=>{const f=$('wf3');if(f)f.classList.add('show')});
  ev(11800,()=>{const f=$('wf4');if(f)f.classList.add('show');const f2=$('wf5');if(f2)f2.classList.add('show')});
  ev(12300,()=>sl(7,'<span class="ok">✓ Framework deployed</span>'));

  /* ===== SCENE 2: IDE — Data Flow Spec (8.5-17s) ===== */
  ev(13500,()=>hb());
  ev(13800,()=>{hideW('winTerm');hideW('winDBX');bg('Step 2 · Define a Data Flow Spec')});
  ev(14100,()=>{
    setIDE('crm_bundle — Visual Studio Code',specSB,
      '<div class="ide-tab on"><span class="td" style="background:#00A972"></span> bronze_customers.json</div>',specLines,'sp');
    showW('winIDE',{width:'940px',height:'560px',left:'90px',top:'40px'});
  });
  // Section boundaries (1-indexed line numbers within specLines)
  const m1=1, m2=secMeta.length;                       // spec metadata
  const s1=m2+1, s2=m2+secSrc.length;                  // source node
  const x1=s2+1, x2=s2+secXf.length;                   // transformation node
  const t1=x2+1, t2=x2+secTgt.length;                  // target node + data quality
  const ST=150;                                        // ms per line — slow enough to read
  const PAUSE=1100;                                     // beat AFTER each section finishes, so the viewer can read it

  // annotations appear as soon as their section STARTS being written (not after it finishes)
  // Section 1 — spec metadata (id, group, type)
  const b1=14300;
  revealLines('sp',m1,m2,b1,ST,'hl-pur');
  ev(b1+120,()=>annotateSection('sp',m1,m2,'pur','annMeta',
    'Data flow spec &mdash; <b>id</b>, <b>group</b> &amp; type'));
  // Section 2 — source node (starts after meta finishes + a pause)
  const b2=b1+m2*ST+PAUSE;
  revealLines('sp',s1,s2,b2,ST,'hl-blu');
  ev(b2+120,()=>annotateSection('sp',s1,s2,'blu','annSrc',
    '<b>Source</b> &mdash; cloud_files ingest'));
  // Section 3 — transformation node (starts after source finishes + a pause)
  const b3=b2+(s2-s1+1)*ST+PAUSE;
  revealLines('sp',x1,x2,b3,ST,'hl-yel');
  ev(b3+120,()=>annotateSection('sp',x1,x2,'yel','annXf',
    '<b>Transformation</b> &mdash; SQL reshape'));
  // Section 4 — target node + data quality (starts after transformation finishes + a pause)
  const b4=b3+(x2-x1+1)*ST+PAUSE;
  revealLines('sp',t1,t2,b4,ST,'hl-grn');
  ev(b4+120,()=>annotateSection('sp',t1,t2,'grn','annTgt',
    '<b>Target</b> &mdash; table, CDC &amp; data quality'));
  // target section finishes writing, then a pause before the cursor beat
  const specEnd=b4+(t2-t1+1)*ST+PAUSE;

  // brief cursor beat on the data_quality line inside the target
  ev(specEnd,()=>{sc();mte('sp'+(t1+6))});   // data_quality line inside the target section
  ev(specEnd+400,()=>cke('sp'+(t1+6)));
  ev(specEnd+1100,()=>hc());

  /* ===== SCENE 3: IDE — Pipeline YAML (17-26s) — stays on same IDE ===== */
  ev(25500,()=>{hb();['annMeta','annSrc','annXf','annTgt'].forEach(id=>{const a=$(id);if(a)a.remove()})});
  ev(25700,()=>bg('Step 3 · Create Pipeline YAML'));

  // Cursor moves to crm_pipeline.yml in the sidebar and clicks it
  const ymlFile=()=>[...$('ideS').querySelectorAll('.sf')].find(f=>f.textContent.includes('crm_pipeline.yml'));
  ev(26000,()=>{sc();mte(ymlFile())});
  ev(26500,()=>{
    cke(ymlFile());
    // Just highlight the clicked file in sidebar — don't change the tree structure
    const sideFiles=$('ideS').querySelectorAll('.sf');
    sideFiles.forEach(f=>f.classList.remove('on'));
    // Find the crm_pipeline.yml entry and highlight it
    sideFiles.forEach(f=>{if(f.textContent.includes('crm_pipeline.yml'))f.classList.add('on')});
    // Add new tab, switch active
    $('ideTabs').innerHTML='<div class="ide-tab"><span class="td" style="background:#00A972"></span> bronze_customers.json</div><div class="ide-tab on"><span class="td" style="background:#FF3621"></span> crm_pipeline.yml</div>';
    // Swap editor content to YAML
    const ed=$('ideEd');ed.innerHTML='';
    yamlLines.forEach((h,i)=>{const d=document.createElement('div');d.className='el';d.id='yl'+(i+1);
    d.innerHTML=`<span class="ln">${i+1}</span><span class="code">${h}</span>`;ed.appendChild(d)});
    hc();
  });
  // Lines appear
  for(let i=1;i<=yamlLines.length;i++) ev(27000+i*150,()=>{const e=$('yl'+i);if(e)e.classList.add('show')});

  // Cursor clicks framework_path line (line 9), then annotation appears aligned to it
  ev(29700,()=>{sc();mte('yl9')});
  ev(30300,()=>{
    cke('yl9');
    const line=$('yl9');if(line){line.classList.add('hlp');
      const a=document.createElement('div');a.className='ann pur';a.id='annFw';
      a.innerHTML='← Framework: <b>'+FW_PATH+'</b>';

      parent.appendChild(a);
      setTimeout(()=>a.classList.add('show'),50);
    }
  });

  // Cursor clicks spec path line (line 11), annotation appears
  ev(31500,()=>mte('yl11',true));
  ev(32100,()=>{
    cke('yl11');
    const l11=$('yl11'),l12=$('yl12');
    if(l11)l11.classList.add('hlg');if(l12)l12.classList.add('hlg');

    a.innerHTML='← Data flow spec group / ID to attach this pipeline';
    const parent=$('winIDE').querySelector('.ide-m');
    const lineRect=l11?l11.getBoundingClientRect():null;
    const parentRect=parent.getBoundingClientRect();const k=__scale||1;

    parent.appendChild(a);
    setTimeout(()=>a.classList.add('show'),50);
  });
  ev(33500,()=>hc());

  /* ===== SCENE 4: Deploy Pipeline — integrated terminal over IDE (26-33s) ===== */
  ev(34500,()=>hb());
  // IDE stays on screen (from Scene 3); terminal docks over its bottom half like VS Code
  ev(34800,()=>{

  ev(35700,()=>{
    const cmdEl=$('cmd4');
    if(cmdEl) typeCmd(cmdEl,'databricks bundle deploy -t dev',40,()=>{const tc=$('tc4');if(tc)tc.style.display='none'});
  });

  /* ===== SCENE 5: after typing, split to half-screen so workspace fills up while deploying ===== */
  // shrink IDE + terminal to the LEFT half, bring in an (empty) workspace browser on the RIGHT
  ev(37200,()=>{
    const ide=$('winIDE');ide.classList.add('expand');
    Object.assign(ide.style,{width:'540px',height:'560px',left:'20px',right:'auto',top:'40px'});

    showW('winDBX',{width:'540px',height:'560px',left:'auto',right:'20px',top:'40px'});

  ev(39600,()=>{const f=$('pf3');if(f)f.classList.add('show');const f2=$('pf4');if(f2)f2.classList.add('show')});
  ev(40100,()=>sl(3,'<span class="re">Creating pipeline:</span> crm_pipeline'));

  // deploy done — terminal stays docked on the left; it'll get covered by the browser later
  ev(41900,()=>hb());

  // 3. highlight the newly-created pipeline file in the workspace (no click — that comes on the Pipelines nav)

function go(){
  resetVisuals();
  buildTimeline();
  elapsed=0;done=false;playing=true;
  $('playBtn').innerHTML='⏸';$('playBtn').title='Pause';
  $('playBtn').classList.remove('hidden');
  $('replayBtn').classList.add('hidden');$('skipBtn').classList.remove('hidden');
  updateBar();
  scheduleFromNow();
}

function skip(){seekTo(DUR)}

function redo(){
  document.querySelectorAll('.win,.nd,.tl,.ws-fi,.ws-path,.dag-arrow,.pipe-topbar,.pipe-status-bar,.dag-area,.nd-wrap,.nd-check,.nd-topbar,.nd-dur,.nd-stats span,.dag-zoom,.badge,.el').forEach(el=>el.style.transition='');
  go();
}

window.addEventListener('load',()=>{fitDemo();setTimeout(go,300);});
