data_flow_id: base_customer
data_flow_group: yaml_samples
data_flow_type: nodespec
nodes:
- name: v_customer
  node_type: source
  source_type: delta
  config:
    mode: stream
    database: '{staging_schema}'
    table: customer
    cdf_enabled: true
- name: target_customer
  node_type: target
  config:
    table: customer
    table_properties:
      delta.enableChangeDataFeed: 'true'
    schema_path: customer_schema.json
    input_flows:
    - view: v_customer
      flow: f_v_customer
